name: Publish to npm

# Publishes @vtx-labs/envjoy to npm via OIDC trusted publishing.
#
# Authentication uses short-lived, workflow-scoped OIDC credentials -- there is
# no npm token to store, leak, or rotate, and provenance is attested
# automatically. Manual dispatch only, gated behind the `release` environment,
# and restricted to the canonical repository.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run every step except the actual npm publish"
        type: boolean
        default: false

# contents: read to check out; id-token: write to mint the OIDC credential.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify & publish
    runs-on: ubuntu-latest
    # Run only on the canonical repository, never on a fork.
    if: ${{ github.repository == 'VTX-Labs/envjoy' }}
    # Configure required reviewers and branch protection on this environment in
    # repo Settings -> Environments.
    environment:
      name: release
      url: https://www.npmjs.com/package/@vtx-labs/envjoy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v6 reads the pnpm version from package.json's "packageManager" field;
      # do not also set "version" here or the action errors on the conflict.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, build
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Verify version is not already published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing $NAME@$VERSION"
          if pnpm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION already exists on npm. Bump the version in package.json."
            exit 1
          fi

      # No token needed: npm authenticates with the OIDC id-token.
      - name: Publish
        if: ${{ inputs.dry-run == false }}
        run: npm publish --access public

      - name: Dry run summary
        if: ${{ inputs.dry-run == true }}
        run: echo "Dry run complete. Build, test, and verify passed; publish skipped."
